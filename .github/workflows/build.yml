name: Build Cepheus A16 Kernel (KSUN 3.3.0 + SUSFS 2.1.0)

on:
  workflow_dispatch:
    inputs:
      ksun_version:
        description: "KSUN setup.sh mode: 'legacy' for manual-hook non-GKI trees like this one, or blank/latest for kprobe-based"
        required: false
        default: "legacy"
      susfs_version:
        description: "SUSFS version tag"
        required: false
        default: "v2.1.0"
      defconfig:
        description: "Defconfig target"
        required: false
        default: "cepheus_defconfig"

# Keep it light: single job, no matrix, ccache for incremental speed.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          # Do NOT use --recursive here: the KernelSU-Next gitlink in this
          # tree is an orphan reference (not declared in .gitmodules), so a
          # blind recursive submodule init can leave a broken/empty dir.
          submodules: false
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves libyaml-dev pkg-config \
            build-essential ccache git curl python3 python3-pip \
            zip unzip device-tree-compiler rsync \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          # Sanity check: confirm the actual cross assembler this build
          # depends on exists before spending 40 minutes to find out via a
          # cryptic "/usr/bin/as: unrecognized option '-EL'" deep in a
          # nested vdso/Makefile build (clang silently falls back to the
          # host's plain /usr/bin/as when -no-integrated-as is set but no
          # aarch64-linux-gnu-as is on PATH — that's what happened before
          # this package was added).
          command -v aarch64-linux-gnu-as >/dev/null || { echo "aarch64-linux-gnu-as still missing after install"; exit 1; }
          # dtbo.img packaging (mkdtboimg.py) hardcodes a call to `python2`,
          # which Ubuntu dropped from its repos entirely a few releases ago.
          # The script itself is generally py2/py3 compatible, so shim
          # python2 -> python3 rather than fighting to install real py2.
          if ! command -v python2 >/dev/null; then
            sudo ln -s "$(command -v python3)" /usr/local/bin/python2
          fi
          # Sanity check: fail fast here if dtc's yaml link dependency isn't
          # actually resolvable, instead of 20 minutes into the build.
          pkg-config --exists yaml-0.1 && echo "libyaml OK: $(pkg-config --modversion yaml-0.1)" || {
            echo "pkg-config cannot find yaml-0.1.pc — dtc build will fail to link"; exit 1; }

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cepheus-a16-${{ github.run_id }}
          restore-keys: cepheus-a16-
          max-size: 2G

      - name: Fetch prebuilt clang (r383902, matches build.config.common)
        run: |
          # clang-r383902 has since been pruned from the tip of `master`
          # (Google periodically drops old prebuilts from HEAD to keep the
          # live branch smaller) — that's why both the earlier archive
          # attempt against master and the sparse-checkout attempt came up
          # empty. It's still present on old release tags though, e.g.
          # android-11.0.0_r28, which is what this exact toolchain shipped
          # with. Confirmed working pattern from the kernel-building
          # community, so we pin to that tag instead of a moving branch.
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r383902
          curl -LSsf \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r28/clang-r383902.tar.gz" \
            -o clang.tar.gz
          # Verify we actually got a gzip file, not an HTML error page,
          # before handing it to tar (this is exactly what bit us last run).
          file clang.tar.gz | grep -qi gzip || { echo "Download is not a valid gzip file:"; file clang.tar.gz; head -c 300 clang.tar.gz; exit 1; }
          tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r383902
          rm -f clang.tar.gz
          chmod -R +x prebuilts-master/clang/host/linux-x86/clang-r383902/bin
          # Sanity check: fail fast if clang isn't actually there instead of
          # discovering it 40 minutes into the build.
          test -x prebuilts-master/clang/host/linux-x86/clang-r383902/bin/clang
          # CROSS_COMPILE=aarch64-linux-gnu- depends on this prebuilt bundling
          # matching cross tool symlinks (ld, ar, nm, etc). Confirm at least
          # one exists now rather than hitting a confusing failure deep in
          # the actual kernel compile later.
          ls prebuilts-master/clang/host/linux-x86/clang-r383902/bin/aarch64-linux-gnu-* >/dev/null 2>&1 || \
            echo "WARNING: no aarch64-linux-gnu-* tools found in this clang prebuilt — CROSS_COMPILE may need a different prefix, check bin/ contents"

      - name: Fetch build-tools (fetch_fpath / gen_headers deps)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/build \
            build-tools-src
          mkdir -p build/build-tools
          rsync -a build-tools-src/tools/ build/build-tools/path/linux-x86/ || true

      - name: Clean orphan KernelSU-Next gitlink
        run: |
          # This path exists as a stale gitlink (not a real submodule entry)
          # inherited from upstream. Remove it before installing KSUN fresh
          # so setup.sh doesn't collide with a half-populated directory.
          rm -rf KernelSU-Next
          git rm --cached KernelSU-Next 2>/dev/null || true

      - name: Install KernelSU-Next (${{ github.event.inputs.ksun_version }} mode)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${{ github.event.inputs.ksun_version }}"
          # --- ROOT CAUSE of the "undefined symbol: ksu_handle_sys_reboot"
          # failure: KSU-Next has two mutually exclusive integration modes.
          # Default = kprobe-based (hooks attached dynamically at runtime,
          # no source patching, and no static ksu_handle_* functions to
          # link against). "legacy" = manual-hook mode, which patches
          # do_execve/open/vfs_read/stat/reboot syscalls directly and DOES
          # define those ksu_handle_* functions statically.
          #
          # This raystef66 fork's kernel/reboot.c already has the manual
          # hook call baked in (inherited from an earlier non-GKI
          # integration), so it needs the "legacy" source variant to match
          # — passing a version-looking string like "3.3.0" here pulled
          # the kprobe-based variant instead, which never defines the
          # symbol the pre-patched reboot.c expects. If kprobes later prove
          # unreliable on this device (per the InfiniR session's SELinux
          # issues), that's consistent with staying on "legacy" here.

      - name: Apply SUSFS v2.1.0 (backported for non-GKI 4.14)
        run: |
          git clone --depth=1 -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu susfs4ksu-src || \
          git clone --depth=1 https://github.com/sidex15/susfs4ksu susfs4ksu-src
          echo "NOTE: main susfs4ksu branches target GKI 5.10+. This 4.14"
          echo "downstream tree needs the backported patch set (see"
          echo "sidex15/android_kernel_lge_sm8150 for the SM8150 precedent)."
          echo "Drop the actual backport patch file into patches/ and apply"
          echo "it here with: patch -p1 < patches/susfs-4.14-backport.patch"
          # patch -p1 < patches/susfs-2.1.0-4.14-backport.patch

      - name: Remove .git before building
        run: |
          # The InfiniR session hit a build-breaking issue caused by a
          # leftover .git folder inside a patched subtree (KernelSU-Next or
          # susfs) confusing the kernel's version/localversion scripts.
          find . -maxdepth 3 -name ".git" -not -path "./.git" -exec rm -rf {} + || true

      - name: Patch python2-only scripts for python3 compat
        run: |
          # mkdtboimg.py in this old tree is genuinely written for python2
          # (xrange, str/bytes mixing) — Ubuntu no longer ships python2 at
          # all, and patching every py2/py3 incompatibility one at a time
          # is a losing game. AOSP's current libufdt tree has a fully
          # ported python3-native version with the same CLI (create/dump/
          # cfg_create), so just replace the file wholesale.
          if [ -f scripts/dtc/mkdtboimg.py ]; then
            curl -LSs "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" \
              | base64 -d > scripts/dtc/mkdtboimg.py
            chmod +x scripts/dtc/mkdtboimg.py
            head -1 scripts/dtc/mkdtboimg.py | grep -q python3 || { echo "Replacement mkdtboimg.py doesn't look right"; exit 1; }
          fi

      - name: Configure defconfig
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r383902/bin:$PATH"
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          # CROSS_COMPILE/CLANG_TRIPLE are mandatory here — without a target
          # triple, clang defaults to compiling for the *host* arch
          # (x86_64), not arm64. That mismatch is what produced the later
          # "register 'sp' unsuitable" and "'I' constraint" errors: those
          # are ARM64 asm constraints being fed to an x86_64 target.
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            "${{ github.event.inputs.defconfig }}"

      - name: Enable KSUN + SUSFS Kconfig options
        run: |
          # scripts/config lives in the source tree root, not inside out/
          # (only .config and build artifacts get generated there) — call
          # it from root and point --file at out/.config instead of cd-ing
          # into out first.
          if [ ! -f scripts/config ]; then
            echo "scripts/config missing from this tree, fetching upstream copy"
            curl -LSs -o scripts/config \
              "https://raw.githubusercontent.com/torvalds/linux/master/scripts/config"
          fi
          chmod +x scripts/config
          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG
          # Regular also failed the exact same broken probe, confirming
          # this isn't a strong-vs-regular issue — the compiler-check
          # itself can't succeed for any stackprotector flag on this tree.
          # Disable it entirely so the Makefile's ifdef-gated check block
          # for CC_STACKPROTECTOR_REGULAR/STRONG never triggers at all.
          ./scripts/config --file out/.config \
            -d CC_STACKPROTECTOR_STRONG \
            -d CC_STACKPROTECTOR_REGULAR \
            -e CC_STACKPROTECTOR_NONE
          # The 32-bit compat VDSO's link step calls $(LD), which we've
          # forced globally to ld.lld for the main 64-bit build — it never
          # picks up the arm-linux-gnueabi cross linker meant for that one
          # target, hence "cannot represent machine 'arm'". Untangling that
          # routing in this old vdso32 Makefile isn't worth it if 32-bit
          # app support isn't actually needed day-to-day — disable it here.
          # If you do need 32-bit app compatibility, flag it and we'll fix
          # the linker routing properly instead of disabling this.
          ./scripts/config --file out/.config -d COMPAT_VDSO
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r383902/bin:$PATH"
          # This old CAF 4.14 tree's scripts/dtc/Makefile doesn't run the
          # pkg-config auto-detection modern kernels use to add -lyaml when
          # linking scripts/dtc/dtc. Force it via both HOSTLDLIBS_dtc (kbuild
          # 4.18+ name) and HOSTLOADLIBES_dtc (the pre-4.18 name this 4.14
          # tree actually uses) since HOSTLDLIBS_dtc alone had no effect.
          #
          # CROSS_COMPILE/CLANG_TRIPLE: same reasoning as the defconfig step
          # — required so clang targets arm64 instead of silently defaulting
          # to the runner's host arch.
          make O=out ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTLDLIBS_dtc="-lyaml" HOSTLOADLIBES_dtc="-lyaml" \
            -j$(nproc --all) 2>&1 | tee build.log
          # Belt-and-suspenders: even with pipefail, explicitly confirm the
          # actual kernel image exists before calling this step successful,
          # so a silent early failure can never again slip through as green.
          test -f out/arch/arm64/boot/Image || test -f out/arch/arm64/boot/Image.gz || {
            echo "Build did not produce a kernel Image — see build.log"
            tail -n 80 build.log
            exit 1
          }

      - name: Package AnyKernel3 zip
        run: |
          # This kernel repo does NOT vendor AnyKernel3 — there's no
          # tracked AnyKernel3/ folder with anykernel.sh/tools/META-INF in
          # it, which is why the previous zip was just a bare Image.gz-dtb
          # with no installer scaffolding around it (not flashable). Other
          # cepheus kernel build scripts in the community all clone the
          # official template fresh and drop in a device-specific
          # anykernel.sh, so do the same here.
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          # Cepheus device properties, adapted from a working cepheus AK3
          # config. supported.versions is left blank so the installer
          # doesn't refuse to flash over version-string mismatches while
          # this A16 build is still in bring-up/testing.
          cat > AnyKernel3/anykernel.sh << 'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Cepheus A16 KSUN+SUSFS
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cepheus
          device.name2=Cepheus
          device.name3=cepheus-user
          device.name4=Mi 9
          device.name5=Mi9
          supported.versions=
          supported.patchlevels=
          '; } # end properties
          # shell variables
          block=/dev/block/bootdevice/by-name/boot; is_slot_device=0; ramdisk_compression=auto;
          ## AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh;
          ## AnyKernel install
          split_boot;
          flash_boot;
          ## end install
          EOF

          # Drop in whichever image variant the build actually produced.
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image AnyKernel3/

          # dtbo.img is intentionally NOT included/flashed here: this build
          # only changed Kconfig (KSU/SUSFS) and didn't touch any .dts
          # sources, so the dtbo already on the device stays compatible.
          # If that assumption turns out wrong (boot issues pointing at
          # devicetree/dtbo mismatch), flag it and we'll add it properly.

          cd AnyKernel3
          zip -r9 ../cepheus-a16-ksun${{ github.event.inputs.ksun_version }}-susfs${{ github.event.inputs.susfs_version }}-$(date +%Y%m%d).zip . \
            -x ".git*" -x "README.md"

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-a16-ksun-susfs
          path: "*.zip"
          retention-days: 14
